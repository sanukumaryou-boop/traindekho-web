name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_train_cache:
        description: "Re-fetch train data from API (TRAIN_CACHE_REFRESH=1)"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          # Manual runs can force a refresh; normal pushes reuse .cache/train-build
          TRAIN_CACHE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_train_cache && '1' || '0' }}
        run: |
          cd ~/traindekho-web

          git fetch origin
          git reset --hard origin/main

          npm ci
          npm run build

          sudo systemctl restart traindekho-web
