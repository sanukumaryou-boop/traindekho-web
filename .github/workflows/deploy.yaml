name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd ~/traindekho-web

          git fetch origin
          git reset --hard origin/main

          npm ci
          npm run build

          sudo systemctl restart traindekho-web